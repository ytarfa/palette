<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="readme.css" />
    <style>
      body {
        width: 1280px;
        height: 600px;
      }
      /* Cut off by the bottom edge. */
      .window {
        width: 1040px;
        height: 600px;
        margin: 44px auto 0;
        border-radius: 14px 14px 0 0;
      }
      .viewport iframe {
        background: #fff;
      }
      .dark .viewport iframe {
        background: #0a0a0a;
      }
    </style>
  </head>
  <body>
    <header class="caption">
      <h1>Plugins only see what you allow.</h1>
      <p>Other extensions can add commands. You approve each one, and its access, in settings.</p>
    </header>
    <div class="window">
      <div class="toolbar">
        <div class="dots"><i></i><i></i><i></i></div>
        <div class="url">Palette settings</div>
        <div class="ext"><img src="/icons/128.png" alt="" /></div>
      </div>
      <div class="viewport">

        <iframe></iframe>
      </div>
    </div>
    <script src="readme.js"></script>
  </body>
</html>

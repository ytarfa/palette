name: Release

# Pushing a version tag (v1.2.3) builds the extension at that tag and publishes
# it as a pre-release, with the built extension attached as palette.zip. Test
# it, then run the Promote workflow (promote.yml) to make it the latest release.
# The README links to releases/latest/download/palette.zip, which skips
# pre-releases, so nothing reaches users until it's promoted.
#
# The tag is the version: it's written into the built manifest.json.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # main, to check the tag is on it

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main. Tag a commit from main."
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION=${VERSION#v}
          jq --arg v "$VERSION" '.version = $v' dist/manifest.json > manifest.tmp && mv manifest.tmp dist/manifest.json
          (cd dist && zip -qr ../palette.zip .)
          cp palette.zip "palette-$VERSION.zip"

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" palette.zip "palette-${TAG#v}.zip" \
            --verify-tag \
            --prerelease \
            --title "Palette ${TAG#v}" \
            --generate-notes
